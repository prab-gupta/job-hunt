        - paragraph [ref=e219]
        - paragraph [ref=e220]:
          - strong [ref=e221]: About Crodox
        - paragraph [ref=e222]: "Crodox is a compiler-based code isolation platform. Our tagline says it best: “Isolate components into independent repositories, merge changes back seamlessly."
        - paragraph [ref=e223]: Crodox transforms software development by enabling effortless scaling, faster onboarding, secure outsourcing, conflict prevention, and stronger IP protection; making AI workflows more efficient and secure through reduced context windows; and reducing the cybersecurity attack surface.
        - paragraph [ref=e224]: We're a startup, small and fast-moving.
        - paragraph [ref=e225]
        - paragraph [ref=e226]:
          - strong [ref=e227]: The Role
        - paragraph [ref=e228]: We're looking for a Developer Advocate to become the human bridge between Crodox and the engineers we build for. You'll help developers understand what Crodox exactly does, why it matters, and how to get value from it fast - through content, community, conversation, and code.
        - paragraph [ref=e229]: "This is a rare hybrid role: equal parts hands-on technical credibility and comfort with public-facing communication."
        - paragraph [ref=e230]
        - paragraph [ref=e231]:
          - strong [ref=e232]: What you will do
        - list [ref=e233]:
          - listitem [ref=e234]:
            - strong [ref=e235]: "Create technical content:"
            - text: blog posts, tutorials, walkthroughs, and demos showing how Crodox works
          - listitem [ref=e236]:
            - strong [ref=e237]: "Build developer-facing presence:"
            - text: represent Crodox on X, LinkedIn, Youtube, Reddit, Stack Overflow, dev forums, and relevant communities - sharing genuinely useful technical insight, not just product pushes
          - listitem [ref=e238]:
            - strong [ref=e239]: "Talk to users:"
            - text: run calls, gather feedback, and translate what enterprise engineering teams actually struggle with back into product and marketing input
          - listitem [ref=e240]:
            - strong [ref=e241]: "Represent Crodox at events:"
            - text: conferences, meetups, and webinars targeting enterprise engineering audiences (we're active at events like GITEX)
          - listitem [ref=e242]:
            - strong [ref=e243]: "Partner with product & engineering:"
            - text: stay close enough to the codebase and roadmap that your content is technically accurate and your instincts about what developers want are grounded in reality
          - listitem [ref=e244]:
            - strong [ref=e245]: "Help shape our narrative:"
            - text: help translate our narrative into content developers and their leadership actually trust
        - paragraph [ref=e246]
        - paragraph [ref=e247]:
          - strong [ref=e248]: What we are looking for
        - list [ref=e249]:
          - listitem [ref=e250]: Real software development experience - you've written production code, ideally touching C#, JavaScript & React, or large/legacy codebases specifically. You don't need to be a 10-year veteran, but you need to have been in the trenches enough to speak credibly to engineers
          - listitem [ref=e251]: A track record of explaining technical things well - through a blog, YouTube channel, conference talks, open-source contributions, internal documentation, or prior DevRel/developer-marketing work
          - listitem [ref=e252]: Comfort being the public-facing voice of a technical product - on camera, on stage, or just consistently on LinkedIn/X
          - listitem [ref=e253]: Self-starter energy - this is a start-up, so you'll be building the developer advocacy function largely from scratch
          - listitem [ref=e254]: Working proficiency in English required
